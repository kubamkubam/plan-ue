<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zajęć</title>
<meta name="description" content="Plan zajęć UEW, aktualizowany automatycznie z plan.ue.wroc.pl">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan UEW">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --line: #e6e2db;
  --line-soft: #efece6;
  --text: #1b1c20;
  --text-2: #5d5f66;
  --text-3: #8d8f96;
  --accent: #3446d4;
  --accent-soft: #e8ebfd;
  --ok: #1f8a4c;
  --ok-soft: #e3f4ea;
  --sep: #c9c2b6;
  --warn: #b86e00;
  --warn-soft: #fff4e0;
  --bad: #c2372f;
  --shadow: 0 1px 2px rgba(20, 20, 30, .05), 0 4px 16px rgba(20, 20, 30, .04);
  --radius: 16px;
  --sub-l: 44%; --sub-s: 62%; --tint-l: 95%; --tint-s: 70%;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171b;
    --surface: #1f2126;
    --line: #2f3239;
    --line-soft: #292b31;
    --text: #eceef2;
    --text-2: #a6a9b1;
    --text-3: #767a83;
    --accent: #8f9cff;
    --accent-soft: #272b4a;
    --ok: #4fc47f;
    --ok-soft: #173024;
    --sep: #4c505a;
    --warn: #f0a93b;
    --warn-soft: #332917;
    --bad: #ff7a70;
    --shadow: none;
    --sub-l: 70%; --sub-s: 70%; --tint-l: 18%; --tint-s: 28%;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

/* ---------- nagłówek ---------- */
header.top { padding: 22px 0 14px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.eyebrow { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
h1 { margin: 2px 0 0; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; font-weight: 750; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.pill.warn i { background: var(--warn); } .pill.bad i { background: var(--bad); }
.pill button { border: 0; background: none; padding: 0 0 0 4px; cursor: pointer; color: var(--accent); font-size: 13px; }

/* ---------- karta "najbliższe" ---------- */
.hero { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 18px 18px 16px; margin-bottom: 14px; display: grid; gap: 14px; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.25fr 1fr; padding: 22px; } }
.hero-label { font-size: 13px; font-weight: 650; color: var(--text-2); }
.hero-label .live { color: var(--ok); }
.hero-when { font-size: 34px; font-weight: 750; letter-spacing: -.025em; line-height: 1.1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.hero-when small { font-size: 17px; font-weight: 600; color: var(--text-2); letter-spacing: 0; }
.hero-name { font-size: 18px; font-weight: 650; line-height: 1.3; }
.hero-meta { color: var(--text-2); font-size: 14px; margin-top: 3px; }
.hero-next { border-top: 1px solid var(--line-soft); padding-top: 12px; }
@media (min-width: 760px) { .hero-next { border-top: 0; border-left: 1px solid var(--line-soft); padding: 0 0 0 20px; } }
.mini { display: flex; gap: 10px; padding: 6px 0; align-items: baseline; font-size: 14px; }
.mini time { color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 92px; }
.mini span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- zakładki ---------- */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 16px 10px; margin: 0 -16px; }
.seg { display: flex; background: var(--line-soft); border-radius: 12px; padding: 3px; gap: 2px; max-width: 560px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; position: relative; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg .dot { position: absolute; top: 6px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.seg.small { max-width: 300px; flex: 1 1 240px; }
.seg.small button { font-size: 13.5px; padding: 6px; }

/* ---------- baner zmian ---------- */
.notice { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.notice h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.notice ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notice li { font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.notice .btn { margin-top: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 13px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #111428; } }
.chg { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }

/* ---------- zjazd: siatka wyrównana do godzin ---------- */
.zjazd { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; scroll-margin-top: 70px; }
.zjazd > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 16px 4px; }
.zjazd h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.zjazd h2 span { color: var(--text-3); font-weight: 600; font-size: 14px; margin-right: 6px; }
.tag { font-size: 12.5px; font-weight: 650; color: var(--text-2); background: var(--line-soft); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.tag.now { background: var(--accent-soft); color: var(--accent); }
.zgrid { --cg: 22px; display: grid; grid-template-columns: 50px repeat(var(--cols), minmax(0, 1fr)); column-gap: var(--cg); padding: 0 14px 12px; }
/* wyraźna pionowa linia między dniami zjazdu */
.vsep { pointer-events: none; justify-self: start; width: 0; border-left: 2px solid var(--sep); margin-left: calc(var(--cg) / -2 - 1px); }
.dh { grid-row: 1; padding: 10px 2px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line-soft); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; align-items: baseline; font-size: 13px; min-width: 0; }
.dh b { font-size: 14.5px; }
.dh span { color: var(--text-3); font-variant-numeric: tabular-nums; }
.dh.today b { color: var(--accent); }
.tl { grid-column: 1; padding: 10px 0 0; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 650; line-height: 1.2; }
.tl small { display: block; color: var(--text-3); font-weight: 500; font-size: 12.5px; }
.slot { padding: 4px 0; min-width: 0; display: flex; align-items: flex-start; }
.slot > * { flex: 1; min-width: 0; }
.slot.fill { align-items: stretch; }
.free { border: 1.5px dashed var(--line-soft); border-radius: 12px; min-height: 44px; }
.dayoff { border: 1.5px dashed var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 13.5px; font-weight: 600; min-height: 60px; }

.card { border-radius: 12px; background: hsl(var(--h) var(--tint-s) var(--tint-l)); position: relative; }
.card::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3.5px; border-radius: 3px; background: hsl(var(--h) var(--sub-s) var(--sub-l)); }
.card .head { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px 9px 13px; cursor: pointer; border-radius: 12px; }
.card .head:focus-visible { outline: 2px solid var(--accent); }
.card .n { font-weight: 650; line-height: 1.28; overflow-wrap: anywhere; }
.card .m { font-size: 13px; color: var(--text-2); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.card .room { font-weight: 650; color: var(--text); }
.card .ico { display: inline-flex; align-items: center; gap: 3px; color: hsl(var(--h) var(--sub-s) var(--sub-l)); font-weight: 650; }
.card .ico svg { width: 14px; height: 14px; }
.card .chev { position: absolute; right: 8px; top: 9px; width: 14px; height: 14px; color: var(--text-3); transition: transform .15s; }
.card.open .chev { transform: rotate(180deg); }
.card .n { padding-right: 16px; }
.card.past { opacity: .55; }
.card.open { opacity: 1; }
.card.live { outline: 2px solid hsl(var(--h) var(--sub-s) var(--sub-l)); outline-offset: 1px; }
.card.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px hsl(var(--h) var(--sub-s) var(--sub-l) / .45); } 100% { box-shadow: 0 0 0 0 transparent; } }
.body { padding: 0 11px 11px 13px; font-size: 13.5px; }
.body dl { margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.body dt { color: var(--text-3); }
.body dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.body label { display: block; font-weight: 650; margin-bottom: 4px; }
.neditor textarea { width: 100%; min-height: 92px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-size: 16px; line-height: 1.4; }
.neditor textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.note-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; }
.note-actions .btn { padding: 7px 16px; }
.nstat { font-size: 12.5px; color: var(--text-2); }
.nstat.ok { color: var(--ok); font-weight: 650; }
.nstat.dirty { color: var(--warn); font-weight: 650; }
.archive { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.state.warn { background: var(--warn-soft); color: var(--warn); }
.arch-item { border-left: 3.5px solid hsl(var(--h) var(--sub-s) var(--sub-l)); background: hsl(var(--h) var(--tint-s) var(--tint-l)); border-radius: 10px; padding: 9px 11px; margin-top: 10px; }
.arch-h { font-size: 14px; }
.arch-h span { color: var(--text-2); }
.arch-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 5px 0 8px; font-size: 14.5px; }
.arch-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.arch-actions select { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
.legend.abbr { margin-top: 6px; gap: 4px 16px; }
/* nagłówek: dwa przyciski stanu (plan / notatki) */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
button.pill { cursor: pointer; font: inherit; font-size: 13px; }
.pill.off i { background: var(--text-3); }
.pill .rl { color: var(--accent); padding-left: 2px; }
.ctx-note { margin: 0 0 10px; padding: 7px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.ctx-note b { display: block; font-size: 12px; color: var(--text-2); }
.linkbtn { background: none; border: 0; padding: 8px 0 0; color: var(--accent); font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer; text-align: left; }
/* przedmioty: lista -> przedmiot -> rodzaj zajęć */
.subj-link { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.subj-link h3 { justify-content: space-between; }
.go { color: var(--text-3); font-size: 22px; line-height: 1; margin-left: 8px; font-weight: 400; }
.ncount { display: inline-flex; gap: 5px; align-items: center; margin-top: 8px; font-size: 13px; font-weight: 650; color: var(--warn); }
.ncount svg { width: 14px; height: 14px; }
.back { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 650; font-size: 15px; padding: 2px 0 10px; cursor: pointer; }
.phead h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; line-height: 1.25; }
.phead p { margin: 4px 0 12px; color: var(--text-2); font-size: 14px; }
.tlist { display: grid; gap: 10px; margin-bottom: 14px; }
@media (min-width: 760px) { .tlist { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); } }
.tcard { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid hsl(var(--h) var(--sub-s) var(--sub-l)); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); font: inherit; color: inherit; }
.tc-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; }
.tc-h b { color: hsl(var(--h) var(--sub-s) var(--sub-l)); }
.tc-m { color: var(--text-2); font-size: 13.5px; margin-top: 2px; }
.tcard .bar { width: 100%; margin-top: 8px; }
.ty-badge { display: inline-block; font-size: 13px; font-weight: 750; padding: 2px 9px; border-radius: 999px; background: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) var(--sub-s) var(--sub-l)); vertical-align: 3px; margin-right: 4px; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
.prog .bar { flex: 1; margin: 0; width: auto; }
h3.sec { font-size: 15px; margin: 18px 2px 8px; }
.sessions { display: grid; gap: 8px; }
.sess { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.sess.past { opacity: .6; }
.sess.past.open { opacity: 1; }
.sess.next { border-color: hsl(var(--h) var(--sub-s) var(--sub-l)); box-shadow: 0 0 0 1px hsl(var(--h) var(--sub-s) var(--sub-l)); }
.sess-h { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; }
.sess-no { width: 28px; height: 28px; border-radius: 50%; background: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) var(--sub-s) var(--sub-l)); display: flex; align-items: center; justify-content: center; font-weight: 750; font-size: 13px; }
.sess-main { min-width: 0; }
.sess-main b { display: block; font-size: 14.5px; }
.sess-main span { font-size: 13px; color: var(--text-2); }
.sess-note, .sess-add { display: flex; gap: 7px; width: calc(100% - 24px); margin: 0 12px 10px; text-align: left; border: 0; border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; background: hsl(var(--h) var(--tint-s) var(--tint-l)); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.sess-note svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: hsl(var(--h) var(--sub-s) var(--sub-l)); }
.sess-add { background: none; border: 1.5px dashed var(--line); color: var(--text-3); font-weight: 600; }
.sess-body { padding: 0 12px 12px; }
/* skaner QR */
.scan { position: relative; margin-top: 12px; border-radius: 14px; overflow: hidden; background: #000; width: 100%; max-width: 360px; aspect-ratio: 1; }
.scan video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-frame { position: absolute; inset: 16%; border: 3px solid rgba(255, 255, 255, .9); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
details.alt { margin-top: 14px; }
/* obecność */
.attb { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.attb.ok { background: var(--ok-soft); color: var(--ok); }
.attb.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.attb.warn { background: var(--warn-soft); color: var(--warn); }
.att { margin: 0 0 12px; }
.att-l { display: block; font-weight: 650; margin-bottom: 5px; font-size: 13.5px; }
.att-opts { display: flex; gap: 4px; flex-wrap: wrap; }
.att-opts button { flex: 1 1 auto; border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-2); }
.att-opts button.on.present { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.att-opts button.on.absent { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); color: var(--bad); }
.att-opts button.on.madeup { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.att .note-actions { margin-top: 6px; }
.attsum { font-size: 15px; padding: 8px 12px; border-radius: 10px; background: var(--line-soft); }
.attsum.ok { background: var(--ok-soft); color: var(--ok); }
.attsum.warn { background: var(--warn-soft); color: var(--warn); }
.attsum.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.tc-att { font-size: 13px; font-weight: 650; margin-top: 4px; }
.tc-att.ok { color: var(--ok); } .tc-att.warn { color: var(--warn); } .tc-att.bad { color: var(--bad); }
.field label.lim-l { flex: 1 0 100%; font-weight: 650; font-size: 13.5px; color: var(--text-2); }
.field input[type=number] { flex: 0 1 120px; }
/* zajęcia dodane ręcznie */
.manb { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; border: 1px dashed var(--text-3); color: var(--text-2); white-space: nowrap; }
.card.man { box-shadow: inset 0 0 0 1.5px hsl(var(--h) var(--sub-s) var(--sub-l) / .55); }
.chip.man { outline: 1.5px dashed hsl(var(--h) var(--sub-s) var(--sub-l)); outline-offset: -2px; }
.addform { border-color: var(--accent); scroll-margin-top: 70px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
.fgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 650; color: var(--text-2); min-width: 0; }
.fgrid label.wide { grid-column: 1 / -1; }
.fgrid input, .fgrid select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); color: var(--text); font: inherit; font-size: 16px; min-width: 0; width: 100%; }
.toolbar .btn { padding: 7px 12px; }
/* wyszukiwarka */
.pill svg { width: 14px; height: 14px; }
.search-top { display: flex; gap: 8px; margin-bottom: 8px; }
.search-top input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); color: var(--text); font-size: 16px; }
.sr-group { margin: 16px 2px 8px; font-size: 12.5px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.sr { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid hsl(var(--h) var(--sub-s) var(--sub-l)); border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; font: inherit; color: inherit; cursor: pointer; }
.sr .ctx { font-size: 12.5px; color: var(--text-2); font-weight: 600; }
.sr .txt { font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
details.alt summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }
.legend.abbr b { color: var(--text); }

/* ---------- cały semestr ---------- */

.chip { height: 22px; border-radius: 6px; background: hsl(var(--h) var(--tint-s) var(--tint-l)); color: hsl(var(--h) var(--sub-s) calc(var(--sub-l) - 6%)); font-size: 10.5px; font-weight: 750; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 3px; border: 0; cursor: pointer; overflow: hidden; white-space: nowrap; position: relative; min-width: 0; }
@media (prefers-color-scheme: dark) { .chip { color: hsl(var(--h) var(--sub-s) var(--sub-l)); } }

<body>
<div class="wrap">
  <header class="top">

      <div class="eyebrow" id="sub">UEW</div>

    </div>

    </div>

  <section class="hero" id="hero" hidden></section>

    <div class="seg" role="tablist">

      <div class="search-top"><input id="q" type="search" placeholder="Szukaj w notatkach, przedmiotach, salach…" autocomplete="off" enterkeyhint="search" aria-label="Szukaj"><button class="btn" id="qClose">Zamknij</button></div>

  </main>

  <p class="foot" id="foot"></p>
</div>

<script>
"use strict";
// jak w oryginalnym planie: wykłady niebieskie, ćwiczenia i lektorat zielone, laboratoria i reszta czerwone
const TYPE_HUE = { W: 215, "Ćw": 140, Lekt: 140 };
const OTHER_HUE = 2;
const DAY = ["niedziela", "poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota"];
const DAY_ACC = ["niedzielę", "poniedziałek", "wtorek", "środę", "czwartek", "piątek", "sobotę"];
const DAY_SHORT = ["ndz", "pon", "wt", "śr", "czw", "pt", "sob"];
const MONTH = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const TYPE_FULL = { W: "wykład", "Ćw": "ćwiczenia", Lab: "laboratorium", Lekt: "lektorat", Inne: "inne" };
const TYPE_GEN = { W: "wykładu", "Ćw": "ćwiczeń", Lab: "laboratorium", Lekt: "lektoratu", Inne: "innych zajęć" };
const ATT = { present: "Obecny", absent: "Nieobecny", madeup: "Odrobione" };
const ATT_BADGE = { present: ["ok", "✓ obecny"], absent: ["bad", "✗ nieobecny"], madeup: ["warn", "↺ odrobione"] };
const CHANGE_LABEL = { moved: "przeniesione", removed: "odwołane", added: "nowe", room: "sala", teacher: "prowadzący" };
const ICON_NOTE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h7l3 3v8H3z"/><path d="M5.5 7.5h5M5.5 10h5"/></svg>';
const ICON_CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const state = {
  data: null, status: null,
  tab: store.get("tab2", "plan") === "szukaj" ? "plan" : store.get("tab2", "plan"), mode: store.get("mode", "zjazdy"),
  showPast: false, showPS: store.get("showPS", true),
  expanded: new Set(), drafts: new Map(), noteMsg: new Map(),
  deferredRender: false,
  noteMeta: new Map(), sOpen: new Set(), subj: store.get("subj", null),
  scanning: false, qrOpen: false,
  attDraft: new Map(), attMsg: new Map(), limDraft: new Map(), limMsg: new Map(),
  addForm: null, prevTab: "plan",
};
let editorSeq = 0;
const metaOf = (b) => ({ name: b.name, date: b.date, start: b.start, end: b.end, type_short: b.type_short });
const skey = (name, ty) => (ty ? `subj|${name}|${ty}` : `subj|${name}`);
const isPhone = () => matchMedia("(pointer: coarse)").matches;
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toDate(date, time = "00:00") {
  const [y, m, d] = date.split("-").map(Number);
  const [hh, mm] = time.split(":").map(Number);
  return new Date(y, m - 1, d, hh, mm);
}
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function parseLocal(iso) { const [d, t] = iso.split("T"); return toDate(d, t.slice(0, 5)); }
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((dayStart(b) - dayStart(a)) / 864e5);
const fmtDay = (d) => `${d.getDate()} ${MONTH[d.getMonth()]}`;
const fmtShort = (d) => `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}`;
const hm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const cap = (s) => s[0].toUpperCase() + s.slice(1);

function relDay(d, now = new Date()) {
  const n = daysBetween(now, d);
  if (n === 0) return "dziś";
  if (n === 1) return "jutro";
  if (n === -1) return "wczoraj";
  if (n > 1 && n < 7) return `${d.getDay() === 2 ? "we" : "w"} ${DAY_ACC[d.getDay()]}`;
  if (n >= 7) return n < 14 ? `za ${n} dni` : `za ${Math.round(n / 7)} tyg.`;
  return `${-n} dni temu`;
}
function relTime(d, now = new Date()) {
  const min = Math.round((d - now) / 6e4);
  if (Math.abs(min) < 1) return "teraz";
  if (min < 0) {
    const a = -min;
    if (a < 60) return `${a} min temu`;
    if (a < 60 * 24) return `${Math.round(a / 60)} h temu`;
    return `${Math.round(a / 1440)} dni temu`;
  }
  if (min < 60) return `za ${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m && h < 5 ? `za ${h} h ${m} min` : `za ${Math.round(min / 60)} h`;
}
const hueFor = (ev) => TYPE_HUE[ev.type_short] ?? OTHER_HUE;
const initials = (name) => name.split(/[\s–-]+/).filter(Boolean).map((w) => (w.length <= 2 ? w[0].toLowerCase() : w[0].toUpperCase())).join("").slice(0, 5);
function abbr(ev) {
  if (ev.ab) return ev.ab;
  if (ev.kind === "language") return "ANG";
  if (ev.kind !== "elective") return ev.code;
  return initials(ev.name);
}

/* =============== notatki (lokalnie + opcjonalna synchronizacja przez prywatne repo GitHub) =============== */
const Notes = {
  all: store.get("notes", {}),
  dirty: new Set(store.get("notesDirty", [])),
  token: store.get("syncToken", null),
  lastSync: store.get("lastSync", null),
  syncError: null,
  syncing: null,
  repo() { return state.data?.config?.notes_repo; },
  get(key) { const n = this.all[key]; return n && n.text ? n : null; },
  persist() { store.set("notes", this.all); store.set("notesDirty", [...this.dirty]); },
  rec(key) { return this.all[key] || null; },
  // każdy rekord (notatka, obecność, limit, zajęcia dodane ręcznie) synchronizuje się tak samo
  async put(key, obj) {
    this.all[key] = { ...obj, updated: new Date().toISOString() };
    this.dirty.add(key);
    this.persist();
    if (!this.token) return "local";
    try { await this.sync(); return "synced"; } catch (e) { return e.auth ? "auth" : "offline"; }
  },
  save(key, text, meta) { return this.put(key, { ...meta, text }); },
  api(path, opts = {}) {
    return fetch(`https://api.github.com/repos/${this.repo()}/contents/${path}`, {
      cache: "no-store",
      ...opts,
      headers: { Authorization: `Bearer ${this.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
    });
  },
  async pull() {
    // unikalny adres: GitHub trzyma odpowiedź w cache do 60 s, a usunięcie/zmiana musi dojść od razu
    const r = await this.api(`notes.json?t=${Date.now()}`);
    if (r.status === 404) {
      if (!(await this.repoVisible())) { const e = new Error("Brak dostępu do repozytorium notatek"); e.auth = true; throw e; }
      return { notes: {}, sha: null };
    }
    if (r.status === 401 || r.status === 403) { const e = new Error("Klucz jest nieprawidłowy albo wygasł"); e.auth = true; throw e; }
    if (!r.ok) throw new Error(`GitHub: ${r.status}`);
    const j = await r.json();
    const bytes = Uint8Array.from(atob(j.content.replace(/\s/g, "")), (c) => c.charCodeAt(0));
    return { notes: JSON.parse(new TextDecoder().decode(bytes) || "{}"), sha: j.sha };
  },
  async repoVisible() {
    const r = await fetch(`https://api.github.com/repos/${this.repo()}`, { cache: "no-store", headers: { Authorization: `Bearer ${this.token}` } });
    return r.ok;
  },
  async push(notes, sha) {
    const bytes = new TextEncoder().encode(JSON.stringify(notes, null, 1));
    let bin = ""; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
    const r = await this.api("notes.json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Notatki: aktualizacja", content: btoa(bin), ...(sha ? { sha } : {}) }),
    });
    if (r.status === 409 || r.status === 422) return false;
    if (r.status === 401 || r.status === 403) { const e = new Error("Klucz nie ma prawa zapisu"); e.auth = true; throw e; }
    if (!r.ok) throw new Error(`GitHub: ${r.status}`);
    return true;
  },
  sync() {
    if (!this.token || !this.repo()) return Promise.resolve(false);
    if (this.syncing) return this.syncing.then(() => this.sync());
    this.syncing = (async () => {
      try {
        for (let attempt = 0; attempt < 4; attempt++) {
          const { notes: remote, sha } = await this.pull();
          let changedLocal = false;
          for (const [k, rn] of Object.entries(remote)) {
            const ln = this.all[k];
            if (!ln || rn.updated > ln.updated) { this.all[k] = rn; this.dirty.delete(k); changedLocal = true; }
            else if (rn.updated === ln.updated) this.dirty.delete(k);
          }
          if (!this.dirty.size) { this.persist(); this.done(); return changedLocal; }
          const merged = { ...remote };
          for (const k of this.dirty) merged[k] = this.all[k];
          if (await this.push(merged, sha)) { this.dirty.clear(); this.persist(); this.done(); return changedLocal; }
        }
        throw new Error("Konflikt zapisu, spróbuj ponownie");
      } catch (e) { this.syncError = e.message; throw e; }
      finally { this.syncing = null; setTimeout(() => typeof renderNotesPill === "function" && state.data && renderNotesPill(), 0); }
    })();
    return this.syncing;
  },
  done() { this.syncError = null; this.lastSync = new Date().toISOString(); store.set("lastSync", this.lastSync); },
  connect(token) { this.token = token.trim(); store.set("syncToken", this.token); },
  disconnect() { this.token = null; this.lastSync = null; store.del("syncToken"); store.del("lastSync"); },
};
// klucz przekazany kodem QR: ...#sync=TOKEN
(function readHashToken() {
  const m = location.hash.match(/sync=([\w-]+)/);
  if (m) { Notes.connect(m[1]); history.replaceState(null, "", location.pathname + location.search); state.tab = "ustawienia"; state.justPaired = true; }
})();

/* =============== przygotowanie danych =============== */
function manualEvents() {
  const known = new Map();
  for (const e of state.data.events) if (!known.has(e.name)) known.set(e.name, e);
  return Object.entries(Notes.all)
    .filter(([k, r]) => k.startsWith("cls|") && !r.deleted && r.name && r.date && r.start && r.end)
    .map(([k, r]) => {
      const m = known.get(r.name);
      const id = k.slice(4);
      return {
        date: r.date, start: r.start, end: r.end, name: r.name, code: m ? m.code : initials(r.name),
        type_short: r.type_short || "Inne", type: TYPE_FULL[r.type_short] || r.type_short || "inne",
        room: r.room || "", teacher: r.teacher || "", pid: "", kind: "manual", manual: true, mid: id, key: `M|${id}`,
        subjKind: m ? m.kind : "manual", ab: m ? abbr(m) : initials(r.name),
      };
    });
}

function prepare() {
  const events = [...state.data.events.filter((e) => state.showPS || e.kind !== "not_enrolled"), ...manualEvents()]
    .map((e) => ({ ...e, s: toDate(e.date, e.start), e: toDate(e.date, e.end) }))
    .sort((a, b) => a.s - b.s || String(a.code).localeCompare(String(b.code)));
  // scal kolejne bloki tego samego przedmiotu (np. 8:00–9:30 + 9:45–11:15)
  const blocks = [];
  for (const ev of events) {
    const last = blocks[blocks.length - 1];
    const same = last && last.date === ev.date && last.code === ev.code && last.name === ev.name && last.type_short === ev.type_short
      && last.room === ev.room && last.teacher === ev.teacher && !!last.manual === !!ev.manual && ev.s - last.e <= 15 * 6e4;
    if (same) { last.e = ev.e; last.end = ev.end; last.n++; last.parts.push(ev); }
    else blocks.push({ ...ev, n: 1, parts: [ev] });
  }
  const blockOf = new Map();
  for (const b of blocks) for (const p of b.parts) blockOf.set(p.key, b);
  // notatka należy do bloku, jeśli jest zapisana pod kluczem którejkolwiek jego części
  for (const b of blocks) b.nk = (b.parts.find((p) => Notes.get(p.key)) || b).key;
  // notatki bez zajęć w planie -> przechowalnia (nic nie znika po zmianie planu)
  const shown = new Set(blocks.map((b) => b.nk));
  const hidden = new Set(state.data.events.filter((e) => !state.showPS && e.kind === "not_enrolled").map((e) => e.key));
  const orphans = Object.entries(Notes.all).filter(([k, n]) => n.text && !/^(subj|att|lim|cls)\|/.test(k) && !shown.has(k) && !hidden.has(k))
    .map(([k, n]) => ({ k, ...n })).sort((a, b) => ((a.date || "") + (a.start || "")).localeCompare((b.date || "") + (b.start || "")));
  // dni -> zjazdy (dni oddalone o max 2 doby tworzą jeden zjazd)
  const days = new Map();
  for (const b of blocks) { if (!days.has(b.date)) days.set(b.date, []); days.get(b.date).push(b); }
  const zjazdy = [];
  // zjazd = jeden weekend (pt–ndz); dni w tygodniu (np. dodane odrabianie) tworzą osobną grupę
  const weekendOf = (d) => {
    const w = d.getDay();
    if (w !== 5 && w !== 6 && w !== 0) return null;
    const sat = new Date(d); sat.setDate(sat.getDate() + (w === 5 ? 1 : w === 0 ? -1 : 0));
    return isoDate(sat);
  };
  for (const [date, list] of days) {
    const d = toDate(date);
    const wk = weekendOf(d);
    const cur = zjazdy[zjazdy.length - 1];
    const join = cur && (wk ? cur.wk === wk : !cur.wk && daysBetween(cur.days[cur.days.length - 1].d, d) <= 2);
    if (join) cur.days.push({ date, d, list });
    else zjazdy.push({ wk, days: [{ date, d, list }] });
  }
  let zno = 0;
  zjazdy.forEach((z) => {
    // numeruj tylko zjazdy z planu uczelni; same dodane ręcznie zajęcia to "dodatkowe"
    z.no = z.days.some((d) => d.list.some((b) => !b.manual)) ? ++zno : null;
    z.id = z.no ? `z${z.no}` : `x${z.days[0].date}`;
    // zawsze pełny weekend: brakującą sobotę/niedzielę dodaj jako pusty dzień
    const dates = new Map(z.days.map((x) => [x.date, x]));
    for (const x of [...z.days]) {
      const wd = x.d.getDay();
      const other = wd === 6 ? 1 : wd === 0 ? -1 : 0;
      if (other) {
        const od = new Date(x.d); od.setDate(od.getDate() + other);
        const k = isoDate(od);
        if (!dates.has(k)) dates.set(k, { date: k, d: od, list: [] });
      }
    }
    z.cols = [...dates.values()].sort((a, b) => a.d - b.d);
    z.start = z.cols.find((c) => c.list.length).list[0].s;
    const lastDay = [...z.cols].reverse().find((c) => c.list.length);
    z.end = lastDay.list[lastDay.list.length - 1].e;
    z.slots = [...new Set(z.days.flatMap((x) => x.list.flatMap((b) => b.parts.map((p) => p.start))))].sort();
  });
  const allSlots = [...new Set(events.map((e) => e.start))].sort();
  return { blocks, zjazdy, blockOf, allSlots, orphans };
}

function unseenChanges() {
  const seen = store.get("seenChange", null);
  const all = state.data.changes || [];
  if (seen === null) return all.filter((c) => parseLocal(c.detected_at) > Date.now() - 7 * 864e5);
  return all.filter((c) => c.detected_at > seen);
}
function changedMarks() {
  const m = new Map();
  for (const c of unseenChanges()) for (const it of c.items) if (!m.has(`${it.code}|${it.date}`)) m.set(`${it.code}|${it.date}`, it.kind);
  return m;
}

/* =============== widoki =============== */
function metaShort(b) {
  const parts = [`<span>${esc(TYPE_FULL[b.type_short] || b.type)}</span>`];
  if (b.room) parts.push(`<span class="room">${esc(b.room)}</span>`);
  return parts.join("");
}

function renderHero(blocks) {
  const now = new Date();
  const upcoming = blocks.filter((b) => b.e > now && b.kind !== "not_enrolled");
  const el = $("#hero");
  if (!upcoming.length) { el.hidden = true; return; }
  const b = upcoming[0];
  const live = b.s <= now;
  const n = daysBetween(now, b.s);
  let label, when;
  if (live) { label = `<span class="live">● Trwa teraz</span> · do ${b.end}`; when = `${b.start}<small> – ${b.end}</small>`; }
  else if (n === 0) { label = `Dziś · ${relTime(b.s, now)}`; when = `${b.start}<small> – ${b.end}</small>`; }
  else { label = `Najbliższe · ${DAY[b.s.getDay()]}, ${fmtDay(b.s)} · ${relDay(b.s, now)}`; when = `${b.start}<small> – ${b.end}</small>`; }
  const sameDay = upcoming.slice(1).filter((x) => x.date === b.date && x.kind !== "not_enrolled");
  const after = sameDay.length ? sameDay : upcoming.slice(1, 4);
  const endOfDay = [b, ...sameDay].slice(-1)[0];
  const note = Notes.get(b.nk);
  el.innerHTML = `
    <div>
      <div class="hero-label">${label}</div>
      <div class="hero-when">${when}</div>
      <div class="hero-name">${esc(b.name)}</div>
      <div class="hero-meta">${esc(TYPE_FULL[b.type_short] || b.type)}${b.n > 1 ? ` · ${b.n} bloki` : ""} · sala ${esc(b.room || "—")}${b.teacher ? ` · ${esc(b.teacher)}` : ""}</div>
      ${note ? `<button class="snote" style="--h:${hueFor(b)};margin-top:10px" data-open="${esc(b.key)}"><b>Twoja notatka</b>${esc(note.text)}</button>` : ""}
    </div>
    <div class="hero-next">
      <div class="hero-label">${sameDay.length ? `Potem tego dnia · koniec o ${endOfDay.end}` : "Kolejne"}</div>
      ${after.slice(0, 4).map((x) => `<div class="mini"><time>${x.date === b.date ? `${x.start}–${x.end}` : `${DAY_SHORT[x.s.getDay()]} ${fmtShort(x.s)} ${x.start}`}</time><span>${esc(x.name)} · ${esc(x.type_short)}${x.room ? ` · ${esc(x.room)}` : ""}</span></div>`).join("") || `<div class="mini"><span>Koniec zajęć tego dnia</span></div>`}
    </div>`;
  el.hidden = false;
}

function renderNotice() {
  const list = unseenChanges();
  const el = $("#notice");
  const tab = document.querySelector('[data-tab="zmiany"]');
  tab.querySelector(".dot")?.remove();
  if (!list.length) { el.innerHTML = ""; return; }
  tab.insertAdjacentHTML("beforeend", '<i class="dot"></i>');
  const items = list.flatMap((c) => c.items);
  el.innerHTML = `<div class="notice">
    <h3><span>Plan się zmienił</span><span class="tag">${items.length} ${items.length === 1 ? "zmiana" : items.length < 5 ? "zmiany" : "zmian"}</span></h3>
    <ul>${items.slice(0, 6).map((it) => `<li><span class="chg">${CHANGE_LABEL[it.kind] || it.kind}</span><span><b>${esc(it.name)}</b> (${esc(it.type_short)}) · ${esc(it.text)}</span></li>`).join("")}</ul>
    ${items.length > 6 ? `<p style="margin:8px 0 0;font-size:14px">…i ${items.length - 6} więcej w zakładce Zmiany.</p>` : ""}
    <button class="btn" id="ack">OK, widzę</button>
  </div>`;
  $("#ack").onclick = () => { store.set("seenChange", state.data.changes[0].detected_at); render(); };
}

function noteStatusHtml(key) {
  const msg = state.noteMsg.get(key);
  const saved = Notes.get(key)?.text || "";
  const draft = state.drafts.get(key);
  if (draft !== undefined && draft !== saved) return `<span class="nstat dirty">Niezapisane zmiany</span>`;
  if (msg) return `<span class="nstat ${msg.cls}">${esc(msg.text)}</span>`;
  const n = Notes.get(key);
  return n ? `<span class="nstat">Zapisano ${fmtStamp(n.updated, true)}</span>` : `<span class="nstat">Notatka widoczna tylko dla Ciebie</span>`;
}

const attStatus = (b) => Notes.rec(`att|${b.key}`)?.status || "";
function attBadge(b) {
  const s = attStatus(b);
  return s ? `<span class="attb ${ATT_BADGE[s][0]}">${ATT_BADGE[s][1]}</span>` : "";
}
function attEditor(b) {
  const saved = attStatus(b);
  const cur = state.attDraft.has(b.key) ? state.attDraft.get(b.key) : saved;
  const msg = state.attMsg.get(b.key);
  const status = cur !== saved ? `<span class="nstat dirty">Niezapisane</span>`
    : msg ? `<span class="nstat ${msg.cls}">${esc(msg.text)}</span>`
    : `<span class="nstat">${saved ? "Zapisano" : "Nie zaznaczono"}</span>`;
  return `<div class="att"><span class="att-l">Obecność${b.n > 1 ? ` (${b.n} bloki po 90 min)` : ""}</span>
    <div class="att-opts">${Object.entries(ATT).map(([k, l]) => `<button class="${k} ${cur === k ? "on" : ""}" data-att="${k}" data-att-key="${esc(b.key)}" aria-pressed="${cur === k}">${l}</button>`).join("")}</div>
    <div class="note-actions"><button class="btn ${cur !== saved ? "primary" : ""}" data-att-save="${esc(b.key)}">Zapisz obecność</button>${status}</div></div>`;
}
const limKey = (name, ty) => `lim|${name}|${ty}`;
function limitOf(name, ty) {
  const r = Notes.rec(limKey(name, ty));
  return r && r.value !== null && r.value !== undefined && r.value !== "" ? Number(r.value) : null;
}
function attInfo(name, t) {
  const c = { absent: 0, madeup: 0, present: 0 };
  for (const b of t.blocks) { const s = attStatus(b); if (s) c[s] += b.n; }
  const lim = limitOf(name, t.ty);
  const cls = lim === null ? "" : c.absent > lim ? "bad" : c.absent === lim ? "warn" : "ok";
  return { ...c, lim, cls };
}
function manualButtons(b) {
  return b.manual ? `<div class="btns"><button class="btn" data-medit="${esc(b.mid)}">Edytuj zajęcia</button><button class="btn" data-mdel="${esc(b.mid)}">Usuń zajęcia</button></div>` : "";
}

function noteEditor(key, meta, placeholder = "np. przygotować projekt, co przynieść…") {
  state.noteMeta.set(key, meta);
  const note = Notes.get(key);
  const draft = state.drafts.get(key);
  const val = draft !== undefined ? draft : note?.text || "";
  return `<div class="neditor"><textarea id="t${++editorSeq}" data-note="${esc(key)}" placeholder="${esc(placeholder)}" aria-label="Notatka">${esc(val)}</textarea>
    <div class="note-actions"><button class="btn primary" data-save="${esc(key)}">Zapisz</button>${noteStatusHtml(key)}</div></div>`;
}

function cardHtml(b, now, marks) {
  const open = state.expanded.has(b.key);
  const nk = b.nk;
  const note = Notes.get(nk);
  const draft = state.drafts.get(nk);
  const hasDraft = draft !== undefined && draft !== (note?.text || "");
  const cls = ["card", b.e < now ? "past" : "", b.s <= now && b.e > now ? "live" : "", open ? "open" : "", b.manual ? "man" : ""].join(" ");
  const mark = marks.get(`${b.code}|${b.date}`);
  let html = `<div class="${cls}" style="--h:${hueFor(b)}" data-key="${esc(b.key)}">
    <button class="head" aria-expanded="${open}" data-toggle="${esc(b.key)}">${ICON_CHEV}
      <div class="n">${esc(b.name)}</div>
      <div class="m">${metaShort(b)}${b.manual ? `<span class="manb">dodane</span>` : ""}${attBadge(b)}${note || hasDraft ? `<span class="ico" title="Jest notatka">${ICON_NOTE}${hasDraft ? "*" : ""}</span>` : ""}${b.kind === "not_enrolled" ? `<span class="chg">niezapisany</span>` : ""}${mark ? `<span class="chg">${CHANGE_LABEL[mark]}</span>` : ""}</div>
    </button>`;
  if (open) {
    const ctx = [[skey(b.name, b.type_short), `Notatki do ${TYPE_GEN[b.type_short] || b.type}`], [skey(b.name), "Notatki ogólne do przedmiotu"]]
      .map(([k, l]) => (Notes.get(k) ? `<div class="ctx-note"><b>${esc(l)}</b>${esc(Notes.get(k).text)}</div>` : "")).join("");
    html += `<div class="body">
      <dl>
        <dt>Godziny</dt><dd>${b.start}–${b.end}${b.n > 1 ? ` (${b.n} bloki po 90 min)` : ""}</dd>
        <dt>Rodzaj</dt><dd>${esc(TYPE_FULL[b.type_short] || b.type)}</dd>
        <dt>Sala</dt><dd>${esc(b.room || "— (brak w planie)")}</dd>
        <dt>Prowadzi</dt><dd>${esc(b.teacher || "—")}</dd>
      </dl>
      ${attEditor(b)}
      ${ctx}
      <label>Notatka do tych zajęć</label>
      ${noteEditor(nk, metaOf(b))}
      <button class="linkbtn" data-goto="${esc(b.name)}" data-goto-type="${esc(b.type_short)}">Wszystkie zajęcia: ${esc(TYPE_FULL[b.type_short] || b.type)} ›</button>
      ${manualButtons(b)}
    </div>`;
  }
  return html + `</div>`;
}

function renderZjazdy(zjazdy) {
  const now = new Date();
  const marks = changedMarks();
  const past = zjazdy.filter((z) => z.end < now);
  const shown = state.showPast ? zjazdy : zjazdy.filter((z) => z.end >= now);
  let html = "";
  if (past.length) html += `<button class="btn more" id="togglePast">${state.showPast ? "Ukryj minione zjazdy" : `Pokaż minione zjazdy (${past.length})`}</button>`;
  if (!shown.length) html += `<p class="empty">Wszystkie zajęcia w tym semestrze już się odbyły.</p>`;
  for (const z of shown) {
    const n = daysBetween(now, z.start);
    const running = z.start <= now && z.end >= now || (n <= 0 && z.end >= now);
    const tag = z.end < now ? "minął" : running ? "trwa" : n === 1 ? "jutro" : n < 7 ? `za ${n} dni` : relDay(z.start, now);
    const first = z.cols[0].d, last = z.cols[z.cols.length - 1].d;
    const range = first.getMonth() === last.getMonth() ? `${first.getDate()}–${fmtDay(last)}` : `${fmtDay(first)} – ${fmtDay(last)}`;
    const row = new Map(z.slots.map((s, i) => [s, i + 2]));
    const endOf = new Map();
    for (const day of z.days) for (const b of day.list) for (const p of b.parts) if (!endOf.has(p.start)) endOf.set(p.start, p.end);
    let g = "";
    z.cols.forEach((col, ci) => {
      const c = ci + 2;
      const today = daysBetween(now, col.d) === 0;
      g += `<div class="dh ${today ? "today" : ""}" style="grid-column:${c}"><b>${cap(DAY_SHORT[col.d.getDay()])} ${fmtShort(col.d)}${today ? " · dziś" : ""}</b><span>${col.list.length ? `${col.list[0].start}–${col.list[col.list.length - 1].end}` : "wolne"}</span></div>`;
      if (!col.list.length) { g += `<div class="slot fill" style="grid-column:${c};grid-row:2 / ${z.slots.length + 2}"><div class="dayoff">brak zajęć</div></div>`; return; }
      const used = new Set();
      for (const b of col.list) {
        const r = row.get(b.start);
        const span = z.slots.filter((s) => s >= b.start && s < b.end).length || 1;
        for (let k = 0; k < span; k++) used.add(r + k);
        g += `<div class="slot ${span > 1 ? "fill" : ""}" style="grid-column:${c};grid-row:${r} / span ${span}">${cardHtml(b, now, marks)}</div>`;
      }
      for (let r = 2; r < z.slots.length + 2; r++) if (!used.has(r)) g += `<div class="slot fill" style="grid-column:${c};grid-row:${r}"><div class="free"></div></div>`;
    });
    z.slots.forEach((s, i) => { g += `<div class="tl" style="grid-row:${i + 2}">${s}<small>${endOf.get(s) || ""}</small></div>`; });
    for (let ci = 1; ci < z.cols.length; ci++) g += `<i class="vsep" style="grid-column:${ci + 2};grid-row:1 / ${z.slots.length + 2}"></i>`;
    html += `<article class="zjazd" id="${z.id}"><header><h2><span>${z.no ? `Zjazd ${z.no}` : "Dodatkowe"}</span>${range}</h2><span class="tag ${running || (n < 7 && n >= 0) ? "now" : ""}">${tag}</span></header>
      <div class="zgrid" style="--cols:${z.cols.length}">${g}</div></article>`;
  }
  $("#zjazdy").innerHTML = html;
  const t = $("#togglePast");
  if (t) t.onclick = () => { state.showPast = !state.showPast; render(); };
}

function renderSemestr(zjazdy, allSlots, blockOf) {
  const now = new Date();
  const nextZ = zjazdy.find((z) => z.end >= now);
  const cards = zjazdy.map((z) => {
    const first = z.cols[0].d, last = z.cols[z.cols.length - 1].d;
    const range = first.getMonth() === last.getMonth() ? `${first.getDate()}–${fmtShort(last)}` : `${fmtShort(first)}–${fmtShort(last)}`;
    const at = (r, c) => `grid-row:${r};grid-column:${c}`;
    let g = z.cols.map((c, ci) => `<span class="d ${daysBetween(now, c.d) === 0 ? "today" : ""}" style="${at(1, ci + 2)}">${DAY_SHORT[c.d.getDay()]}</span>`).join("");
    for (let ci = 1; ci < z.cols.length; ci++) g += `<i class="vsep" style="grid-column:${ci + 2};grid-row:1 / ${allSlots.length + 2}"></i>`;
    allSlots.forEach((s, si) => {
      const r = si + 2;
      g += `<span class="t" style="${at(r, 1)}">${s}</span>`;
      z.cols.forEach((col, ci) => {
        const pos = at(r, ci + 2);
        const ev = col.list.flatMap((b) => b.parts).find((p) => p.start === s);
        if (!ev) { g += `<span class="nochip" style="${pos}"></span>`; return; }
        const b = blockOf.get(ev.key);
        const cont = b.parts[0] !== ev;
        const note = Notes.get(b.nk);
        g += `<button class="chip ${cont ? "cont" : ""} ${ev.manual ? "man" : ""}" style="--h:${hueFor(ev)};${pos}" data-open="${esc(b.key)}" title="${esc(`${ev.name} (${TYPE_FULL[ev.type_short] || ev.type}) ${ev.start}–${ev.end}${ev.room ? `, sala ${ev.room}` : ""}${note ? `\nNotatka: ${note.text}` : ""}`)}"><span>${esc(abbr(ev))}</span>${cont ? "" : `<small>${esc(ev.type_short)}</small>`}${note && !cont ? `<i class="nd"></i>` : ""}</button>`;
      });
    });
    return `<div class="sc ${z.end < now ? "past" : ""} ${z === nextZ ? "next" : ""}"><div class="sc-h"><b>${z.no ? `Zjazd ${z.no}` : "Dodatkowe"}</b><span>${range}</span></div><div class="sg" style="--cols:${z.cols.length}">${g}</div></div>`;
  });
  // legenda: kolory rodzajów + skróty przedmiotów
  const seen = new Map();
  for (const z of zjazdy) for (const d of z.days) for (const b of d.list) if (!seen.has(abbr(b))) seen.set(abbr(b), b.name);
  const types = [["W", "wykład"], ["Ćw", "ćwiczenia / lektorat"], ["Lab", "laboratorium"]];
  $("#semestr").innerHTML = `<div class="sem">${cards.join("")}</div>
    <div class="legend">${types.map(([ty, l]) => `<span><span class="chip" style="--h:${hueFor({ type_short: ty })}"><span>${ty}</span></span>${l}</span>`).join("")}<span><i class="nd-demo"></i>jest notatka</span></div>
    <div class="legend abbr">${[...seen].map(([a, n]) => `<span><b>${esc(a)}</b> ${esc(n)}</span>`).join("")}</div>
    <p class="hint" style="margin:8px 2px 0">Stuknij zajęcia, żeby zobaczyć szczegóły i notatkę.</p>`;
}

const TYPE_ORDER = { W: 0, "Ćw": 1, Lab: 2, Lekt: 3 };
const plural = (n, one, few, many) => (n === 1 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);

function subjectsModel() {
  const now = new Date();
  const map = new Map();
  for (const b of prepared.blocks) {
    const kind = b.manual ? b.subjKind : b.kind;
    if (!map.has(b.name)) map.set(b.name, { name: b.name, kind, ab: abbr(b), types: new Map(), next: null, min: 0 });
    const s = map.get(b.name);
    if (s.kind === "manual" && kind !== "manual") s.kind = kind;
    if (!s.types.has(b.type_short)) s.types.set(b.type_short, { ty: b.type_short, type_short: b.type_short, type: b.type, blocks: [], teachers: new Set(), rooms: new Set(), min: 0, total: 0, done: 0, next: null });
    const t = s.types.get(b.type_short);
    t.blocks.push(b);
    for (const p of b.parts) { t.total++; if (p.e < now) t.done++; t.min += (p.e - p.s) / 6e4; s.min += (p.e - p.s) / 6e4; }
    if (b.teacher) t.teachers.add(b.teacher);
    if (b.room) t.rooms.add(b.room);
    if (b.e > now && !t.next) t.next = b;
    if (b.e > now && (!s.next || b.s < s.next.s)) s.next = b;
  }
  for (const s of map.values()) s.types = new Map([...s.types].sort((a, b) => (TYPE_ORDER[a[0]] ?? 9) - (TYPE_ORDER[b[0]] ?? 9)));
  const order = { regular: 0, language: 1, elective: 2, not_enrolled: 3, manual: 4 };
  return [...map.values()].sort((a, b) => order[a.kind] - order[b.kind] || a.name.localeCompare(b.name, "pl"));
}
function notesCount(s, ty) {
  const types = ty ? [s.types.get(ty)] : [...s.types.values()];
  let n = types.reduce((acc, t) => acc + t.blocks.filter((b) => Notes.get(b.nk)).length + (Notes.get(skey(s.name, t.ty)) ? 1 : 0), 0);
  if (!ty && Notes.get(skey(s.name))) n++;
  return n;
}
const nextTxt = (b) => `${DAY_SHORT[b.s.getDay()]} ${fmtShort(b.s)}, ${b.start}`;
const ncountHtml = (n) => (n ? `<div class="ncount">${ICON_NOTE}${n} ${plural(n, "notatka", "notatki", "notatek")}</div>` : "");

function subjListHtml(list) {
  const hasOptional = state.data.events.some((e) => e.kind === "not_enrolled");
  return `<div class="subjects">${list.map((s) => `
    <button class="subj subj-link" data-nav="${esc(s.name)}">
      <h3><span>${esc(s.name)}</span><span class="go">›</span></h3>
      <div class="code" style="margin-left:0">${esc(s.ab)}${s.kind === "elective" ? " · do wyboru" : s.kind === "not_enrolled" ? " · jeszcze nie zapisany" : s.kind === "manual" ? " · dodane ręcznie" : ""}${s.next ? ` · następne: ${nextTxt(s.next)}` : " · zakończony"}</div>
      ${[...s.types.values()].map((t) => `
        <div class="row" style="--h:${hueFor(t)}"><b class="ty">${esc(t.ty)}</b>
          <div class="who">${esc([...t.teachers].join(", ") || "—")}<small>${Math.round(t.min / 45)} h · ${t.rooms.size ? "sale: " + esc([...t.rooms].join(", ")) : "sala: —"}${(() => { const a = attInfo(s.name, t); return a.absent || a.lim !== null ? ` · nieobecności: ${a.absent}${a.lim !== null ? `/${a.lim}` : ""}` : ""; })()}</small></div>
          <div class="cnt">${t.done}/${t.total}<div class="bar"><i style="width:${(t.done / t.total) * 100}%"></i></div></div>
        </div>`).join("")}
      ${ncountHtml(notesCount(s))}
    </button>`).join("")}</div>` + (hasOptional ? `
    <div class="panel" style="margin-top:12px">
      <label class="switch"><span><b>Pokazuj przedmioty, na które nie jesteś zapisany</b></span>
      <input type="checkbox" id="ps" ${state.showPS ? "checked" : ""}></label>
    </div>` : "");
}

function subjPageHtml(s) {
  return `<button class="back" data-nav="">‹ Wszystkie przedmioty</button>
    <div class="phead"><h2>${esc(s.name)}</h2>
      <p>${esc(s.ab)}${s.kind === "elective" ? " · do wyboru" : ""} · ${Math.round(s.min / 45)} h w semestrze${s.next ? ` · następne: ${nextTxt(s.next)}` : " · zakończony"}</p></div>
    <div class="tlist">${[...s.types.values()].map((t) => `
      <button class="tcard" style="--h:${hueFor(t)}" data-nav="${esc(s.name)}" data-nav-type="${esc(t.ty)}">
        <div class="tc-h"><b>${esc(cap(TYPE_FULL[t.ty] || t.type))}</b><span class="go">›</span></div>
        <div class="tc-m">${esc([...t.teachers].join(", ") || "—")}</div>
        <div class="tc-m">${t.blocks.length} ${plural(t.blocks.length, "spotkanie", "spotkania", "spotkań")} · ${Math.round(t.min / 45)} h${t.next ? ` · następne: ${nextTxt(t.next)}` : " · zakończone"}</div>
        ${(() => { const a = attInfo(s.name, t); return a.absent || a.lim !== null ? `<div class="tc-att ${a.cls}">Nieobecności: ${a.absent}${a.lim !== null ? ` z ${a.lim}` : ""}</div>` : ""; })()}
        <div class="bar"><i style="width:${(t.done / t.total) * 100}%"></i></div>

}

function sessionHtml(b, i, next) {
  const now = new Date();
  const open = state.sOpen.has(b.key);
  const note = Notes.get(b.nk);
  const status = b.e < now ? "odbyte" : b.s <= now ? "trwa" : b === next ? `najbliższe · ${relDay(b.s, now)}` : relDay(b.s, now);
  return `<div class="sess ${b.e < now ? "past" : ""} ${b === next ? "next" : ""} ${open ? "open" : ""}" style="--h:${hueFor(b)}" data-skey="${esc(b.key)}">
    <button class="sess-h" data-stoggle="${esc(b.key)}" aria-expanded="${open}">
      <div class="sess-no">${i + 1}</div>
      <div class="sess-main"><b>${cap(DAY[b.s.getDay()])}, ${fmtDay(b.s)} ${b.manual ? `<span class="manb">dodane</span>` : ""} ${attBadge(b)}</b><span>${b.start}–${b.end}${b.n > 1 ? ` · ${b.n} bloki` : ""} · sala ${esc(b.room || "—")}${b.teacher ? ` · ${esc(b.teacher)}` : ""}</span></div>
      <span class="tag ${b === next ? "now" : ""}">${status}</span>
    </button>
    ${open ? `<div class="sess-body">${attEditor(b)}<label style="display:block;font-weight:650;font-size:13.5px;margin-bottom:4px">Notatka</label>${noteEditor(b.nk, metaOf(b))}<button class="linkbtn" data-open="${esc(b.key)}">Pokaż w planie ›</button>${manualButtons(b)}</div>`
      : note ? `<button class="sess-note" data-stoggle="${esc(b.key)}">${ICON_NOTE}<span>${esc(note.text)}</span></button>`
      : `<button class="sess-add" data-stoggle="${esc(b.key)}">+ Dodaj notatkę</button>`}
  </div>`;
}

function typePageHtml(s, t) {
  const label = cap(TYPE_FULL[t.ty] || t.type);
  return `<button class="back" data-nav="${esc(s.name)}">‹ ${esc(s.name)}</button>
    <div class="phead" style="--h:${hueFor(t)}"><h2><span class="ty-badge">${esc(label)}</span> ${esc(s.name)}</h2>
      <p>${esc([...t.teachers].join(", ") || "—")} · ${Math.round(t.min / 45)} h · ${t.rooms.size ? "sale: " + esc([...t.rooms].join(", ")) : "sala: —"}</p>
      <div class="prog"><div class="bar"><i style="width:${(t.done / t.total) * 100}%"></i></div><span>odbyte ${t.done} z ${t.total} bloków po 90 min</span></div></div>
    <div class="panel"><h3>Notatki do ${esc(TYPE_GEN[t.ty] || label.toLowerCase())}</h3>
      ${noteEditor(skey(s.name, t.ty), { name: s.name, type_short: t.ty, scope: "type" }, "np. materiały, wymagania, terminy oddania…")}</div>
    ${attPanelHtml(s, t)}
    <h3 class="sec">Zajęcia (${t.blocks.length})</h3>
    <div class="sessions">${t.blocks.map((b, i) => sessionHtml(b, i, t.next)).join("")}</div>
    <div class="btns"><button class="btn" data-add-subj="${esc(s.name)}" data-add-type="${esc(t.ty)}">＋ Dodaj zajęcia (np. odrabianie)</button></div>`;
}

function attPanelHtml(s, t) {
  const a = attInfo(s.name, t);
  const lk = `${s.name}|${t.ty}`;
  const val = state.limDraft.has(lk) ? state.limDraft.get(lk) : a.lim ?? "";
  const msg = state.limMsg.get(lk);
  const verdict = a.lim === null ? "" : a.absent > a.lim ? " — limit przekroczony!" : a.absent === a.lim ? " — limit wykorzystany" : ` — zostało ${a.lim - a.absent}`;
  return `<div class="panel"><h3>Obecność</h3>
    <div class="attsum ${a.cls}"><b>Nieobecności: ${a.absent}${a.lim !== null ? ` z ${a.lim} dozwolonych` : ""}</b>${verdict}</div>
    <p class="hint">Liczone w blokach po 90 min. Obecny: ${a.present} · odrobione: ${a.madeup}. Obecność zaznaczasz przy każdych zajęciach poniżej.</p>
    <div class="field"><label class="lim-l" for="limIn">Limit nieobecności (bloki po 90 min)</label>
      <input type="number" inputmode="numeric" min="0" max="99" id="limIn" data-lim="${esc(lk)}" value="${esc(val)}" placeholder="np. 2">
      <button class="btn primary" data-lim-save="${esc(lk)}">Zapisz limit</button></div>
    ${msg ? `<p class="nstat ${msg.cls}" style="margin:6px 0 0">${esc(msg.text)}</p>` : ""}
  </div>`;
}

function renderPrzedmioty() {
  const list = subjectsModel();
  const s = state.subj && list.find((x) => x.name === state.subj.name);
  const ty = s && state.subj.type ? s.types.get(state.subj.type) : null;
  const el = $("#przedmioty");
  if (!s) { state.subj = null; el.innerHTML = subjListHtml(list); }
  else if (!ty) el.innerHTML = subjPageHtml(s);
  else el.innerHTML = typePageHtml(s, ty);
  const ps = $("#ps");
  if (ps) ps.onchange = (e) => { state.showPS = e.target.checked; store.set("showPS", state.showPS); render(); };
}
function navSubject(name, type) {
  state.subj = name ? { name, type: type || null } : null;
  store.set("subj", state.subj);
  state.tab = "przedmioty";
  render(true);
  window.scrollTo({ top: Math.min(window.scrollY, $(".tabs").offsetTop) });
}

function patUrl() {
  const repo = Notes.repo() || "";
  const [owner, name] = repo.split("/");
  const p = new URLSearchParams({ name: "Plan UEW – notatki", description: `Synchronizacja notatek (repo ${name})`, target_name: owner, expires_in: "365", contents: "write" });
  return `https://github.com/settings/personal-access-tokens/new?${p}`;
}

async function pairWith(token) {
  Notes.connect(token);
  const msg = $("#pairMsg");
  if (msg) msg.innerHTML = `<p class="hint">Łączę…</p>`;
  try {
    await Notes.sync();
    toast("Połączono — notatki są zsynchronizowane");
    render(true);
  } catch (e) {
    Notes.disconnect();
    if ($("#pairMsg")) $("#pairMsg").innerHTML = `<p class="err">Nie udało się połączyć: ${esc(e.message)}. Sprawdź, czy klucz ma dostęp do repozytorium ${esc(Notes.repo())} z uprawnieniem Contents: Read and write.</p>`;
  }
}

async function scanQr() {
  const box = $("#scanBox");
  const msg = $("#pairMsg");
  if (state.scanning) return;
  if (!navigator.mediaDevices?.getUserMedia) { msg.innerHTML = `<p class="err">Ta przeglądarka nie daje dostępu do aparatu. Użyj opcji „wkleić klucz” poniżej.</p>`; return; }
  let stream;
  try {
    if (!window.jsQR) await loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js");
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (e) {
    msg.innerHTML = e && e.name === "NotAllowedError"
      ? `<p class="err">Brak zgody na aparat. Zezwól na dostęp do aparatu dla tej strony i spróbuj ponownie.</p>`
      : `<p class="err">Nie udało się uruchomić aparatu (${esc(e?.message || e?.name || "błąd")}).</p>`;
    return;
  }
  state.scanning = true;
  msg.innerHTML = "";
  box.innerHTML = `<div class="scan"><video playsinline muted autoplay></video><div class="scan-frame"></div></div>
    <p class="hint">Skieruj aparat na kod QR wyświetlony na komputerze.</p><button class="btn" id="scanStop">Anuluj</button>`;
  const video = box.querySelector("video");
  video.srcObject = stream;
  try { await video.play(); } catch {}
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const stop = () => { state.scanning = false; stream.getTracks().forEach((tr) => tr.stop()); box.innerHTML = ""; };
  $("#scanStop").onclick = stop;
  const tick = () => {
    if (!state.scanning) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const sc = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
      const w = Math.round(video.videoWidth * sc), h = Math.round(video.videoHeight * sc);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);
      const code = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
      const m = code && (code.data.match(/sync=([\w-]+)/) || code.data.match(/^(github_pat_\w+|gh[opsu]_\w+)$/));
      if (m) { stop(); if (navigator.vibrate) navigator.vibrate(60); pairWith(m[1]); return; }
    }
    requestAnimationFrame(tick);
  };
  tick();
}

async function showQr() {
  const box = $("#qrBox");
  if (state.qrOpen) { state.qrOpen = false; box.innerHTML = ""; return; }
  const url = `${location.origin}${location.pathname}#sync=${Notes.token}`;
  try {
    if (!window.qrcode) await loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js");
    const q = window.qrcode(0, "M"); q.addData(url); q.make();
    state.qrOpen = true;
    box.innerHTML = `<div class="qr">${q.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>
      <p class="hint">Na iPhonie otwórz aplikację planu (ikona na ekranie początkowym) → Ustawienia → <b>Zeskanuj kod QR</b> i skieruj aparat na ten kod. Kod zawiera Twój klucz — nie pokazuj go innym.</p>
      <button class="btn" id="qrClose">Ukryj kod</button>`;
    $("#qrClose").onclick = showQr;
  } catch { box.innerHTML = `<p class="err">Nie udało się wygenerować kodu.</p>`; }
}

function fmtStamp(iso, isUtc = false) {
  if (!iso) return "—";
  const d = isUtc ? new Date(iso) : parseLocal(iso);
  const n = daysBetween(new Date(), d);
  return n === 0 ? `dziś ${hm(d)}` : n === -1 ? `wczoraj ${hm(d)}` : `${fmtShort(d)}.${d.getFullYear()} ${hm(d)}`;
}

function renderStatus() {
  const el = $("#status"), st = state.status;
  let cls = "", txt;
  if (!st) txt = `Dane z ${fmtStamp(state.data.generated_at)}`;
  else {
    const ago = (Date.now() - parseLocal(st.checked_at)) / 36e5;
    if (!st.ok) { cls = "bad"; txt = `Nie udało się sprawdzić · dane z ${fmtStamp(state.data.generated_at)}`; }
    else if (ago > 8) { cls = "warn"; txt = `Sprawdzono ${relTime(parseLocal(st.checked_at))}`; }
    else txt = `Plan aktualny · sprawdzono ${relTime(parseLocal(st.checked_at))}`;
  }
  if (!navigator.onLine) { cls = "warn"; txt = "Offline · ostatnia pobrana wersja"; }
  el.className = `pill ${cls}`;
  el.innerHTML = `<i></i><span>${txt}</span><button id="reload" aria-label="Odśwież plan" title="Odśwież plan">↻</button>`;
  $("#reload").onclick = () => load(true);
}

function renderNotesPill() {
  const el = $("#notesPill");
  if (!Notes.repo()) { el.hidden = true; return; }
  el.hidden = false;
  let cls = "", txt;
  if (!Notes.token) { cls = "off"; txt = "Notatki: tylko na tym urządzeniu"; }
  else if (Notes.syncing) txt = "Notatki: synchronizuję…";
  else if (Notes.syncError) { cls = "bad"; txt = "Notatki: błąd synchronizacji"; }
  else if (Notes.dirty.size) { cls = "warn"; txt = `Notatki: ${Notes.dirty.size} czeka na wysłanie`; }
  else txt = `Notatki zsynchronizowane${Notes.lastSync ? ` · ${hm(new Date(Notes.lastSync))}` : ""}`;
  el.className = `pill ${cls}`;
  el.title = Notes.token ? "Synchronizuj notatki" : "Włącz synchronizację notatek";

$("#notesPill").onclick = async () => {

  renderNotesPill();

  catch (e) { toast(`Nie udało się zsynchronizować: ${Notes.syncError || e.message}`); }

}

// porównanie bez polskich znaków i wielkości liter; 1 znak -> 1 znak, żeby dało się podświetlić trafienie
function fold(s) {
  s = String(s ?? "");
  let o = "";
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    const f = c === "ł" || c === "Ł" ? "l" : c.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    o += f.length === 1 ? f : c;
  }
  return o;
}
function highlight(text, terms, max = 0) {
  text = String(text ?? "");
  const f = fold(text);
  let ranges = [];
  for (const q of terms) for (let i = f.indexOf(q); i >= 0; i = f.indexOf(q, i + q.length)) ranges.push([i, i + q.length]);
  ranges.sort((a, b) => a[0] - b[0]);
  ranges = ranges.reduce((acc, r) => { const l = acc[acc.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else acc.push([...r]); return acc; }, []);
  let from = 0, to = text.length;
  if (max && text.length > max) { from = ranges.length ? Math.max(0, ranges[0][0] - 60) : 0; to = Math.min(text.length, from + max); }
  let out = from > 0 ? "…" : "", pos = from;
  for (const [a, b] of ranges) {
    if (b <= from || a >= to) continue;
    const s = Math.max(a, from), e = Math.min(b, to);
    out += esc(text.slice(pos, s)) + `<mark>${esc(text.slice(s, e))}</mark>`;
    pos = e;
  }
  return out + esc(text.slice(pos, to)) + (to < text.length ? "…" : "");
}
function noteContext(k, n) {
  const m = k.match(/^subj\|(.+?)(?:\|([^|]+))?$/);
  if (m) return m[2] ? `${m[1]} · notatki do ${TYPE_GEN[m[2]] || m[2]}` : `${m[1]} · notatki ogólne`;
  const b = prepared.blocks.find((x) => x.nk === k);
  const d = n.date ? toDate(n.date) : null;
  return `${n.name || "Zajęcia"} · ${TYPE_FULL[n.type_short] || n.type_short || ""}${d ? ` · ${DAY_SHORT[d.getDay()]} ${fmtShort(d)}, ${n.start || ""}` : ""}${b ? "" : " · w przechowalni"}`;
}
function renderResults() {
  const el = $("#results");
  if (!el || !prepared) return;
  const terms = fold($("#q").value).split(/\s+/).filter(Boolean);
  if (terms.join("").length < 2) {
    el.innerHTML = `<p class="hint">Wpisz co najmniej 2 znaki. Szukam w notatkach, nazwach przedmiotów, salach, prowadzących, datach i obecności. Polskie znaki i wielkość liter nie mają znaczenia — „znakow” znajdzie też „znaków”.</p>`;
    return;
  }
  const hit = (hay) => { const f = fold(hay); return terms.every((q) => f.includes(q)); };
  const notes = Object.entries(Notes.all)
    .filter(([k, n]) => n.text && !/^(att|lim|cls)\|/.test(k))
    .map(([k, n]) => ({ k, n, ctx: noteContext(k, n) }))
    .filter((x) => hit(`${x.ctx} ${x.n.text}`))
    .sort((a, b) => ((a.n.date || "0") + (a.n.start || "")).localeCompare((b.n.date || "0") + (b.n.start || "")));
  const classes = prepared.blocks.filter((b) => hit([b.name, abbr(b), TYPE_FULL[b.type_short] || b.type, b.room, b.room && `sala ${b.room}`, b.teacher,
    DAY[b.s.getDay()], fmtShort(b.s), fmtDay(b.s), b.date, b.start, b.manual ? "dodane ręcznie" : "", ATT[attStatus(b)] || ""].join(" ")));
  const hue = (x) => hueFor({ type_short: x.n.type_short || (x.k.split("|")[2] || "") });
  el.innerHTML = (!notes.length && !classes.length ? `<p class="empty">Nic nie znaleziono dla „${esc($("#q").value)}”.</p>` : "")
    + (notes.length ? `<div class="sr-group">Notatki (${notes.length})</div>` + notes.map((x) => `
      <button class="sr" style="--h:${hue(x)}" data-sr-note="${esc(x.k)}"><div class="ctx">${highlight(x.ctx, terms)}</div><div class="txt">${highlight(x.n.text, terms, 220)}</div></button>`).join("") : "")
    + (classes.length ? `<div class="sr-group">Zajęcia (${classes.length})</div>` + classes.slice(0, 60).map((b) => `
      <button class="sr" style="--h:${hueFor(b)}" data-open="${esc(b.key)}"><div class="ctx">${highlight(`${DAY_SHORT[b.s.getDay()]} ${fmtShort(b.s)}, ${b.start}–${b.end} · ${TYPE_FULL[b.type_short] || b.type}${b.room ? ` · sala ${b.room}` : ""}`, terms)}</div>
        <div class="txt">${highlight(b.name, terms)}${b.teacher ? ` · ${highlight(b.teacher, terms)}` : ""} ${attBadge(b)}${b.manual ? ` <span class="manb">dodane</span>` : ""}</div></button>`).join("")
      + (classes.length > 60 ? `<p class="hint">…i ${classes.length - 60} więcej. Doprecyzuj wyszukiwanie.</p>` : "") : "");
}

// obsługa kliknięć i pisania (delegacja - elementy są przerysowywane)
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-toggle],[data-save],[data-open],[data-open-note],[data-move],[data-copy],[data-drop],[data-nav],[data-stoggle],[data-goto],[data-att],[data-att-save],[data-lim-save],[data-medit],[data-mdel],[data-add-subj],[data-sr-note]");
  if (!t) return;
  const now = hm(new Date());
  if (t.dataset.srNote) return openSearchNote(t.dataset.srNote);
  if (t.dataset.addSubj) return openAddForm({ name: t.dataset.addSubj, type_short: t.dataset.addType });
  if (t.dataset.att) {
    const k = t.dataset.attKey;
    const cur = state.attDraft.has(k) ? state.attDraft.get(k) : attStatus({ key: k });
    state.attDraft.set(k, cur === t.dataset.att ? "" : t.dataset.att);
    state.attMsg.delete(k);
    return render(true);
  }
  if (t.dataset.attSave) {
    const k = t.dataset.attSave;
    const b = prepared.blocks.find((x) => x.key === k);
    if (!b) return;
    const status = state.attDraft.has(k) ? state.attDraft.get(k) : attStatus(b);
    t.disabled = true; t.textContent = "Zapisuję…";
    const res = await Notes.put(`att|${k}`, { ...metaOf(b), status, n: b.n });
    state.attDraft.delete(k);
    state.attMsg.set(k, { cls: res === "synced" || res === "local" ? "ok" : "dirty", text: res === "synced" ? `✓ Zapisano ${now} · na wszystkich urządzeniach` : res === "local" ? `✓ Zapisano ${now}` : `✓ Zapisano ${now} na tym urządzeniu · wyślę później` });
    toast(status ? `Zapisano: ${ATT[status].toLowerCase()}` : "Usunięto zaznaczenie obecności");
    return render(true);
  }
  if (t.dataset.limSave) {
    const lk = t.dataset.limSave;
    const [name, ty] = [lk.slice(0, lk.lastIndexOf("|")), lk.slice(lk.lastIndexOf("|") + 1)];
    const raw = String(state.limDraft.has(lk) ? state.limDraft.get(lk) : $("#limIn")?.value ?? "").trim();
    const value = raw === "" ? null : Math.max(0, Math.min(99, parseInt(raw, 10) || 0));
    await Notes.put(limKey(name, ty), { name, type_short: ty, value });
    state.limDraft.delete(lk);
    state.limMsg.set(lk, { cls: "ok", text: value === null ? `✓ Usunięto limit (${now})` : `✓ Zapisano limit: ${value} (${now})` });
    toast("Zapisano limit nieobecności");
    return render(true);
  }
  if (t.dataset.medit) {
    const r = Notes.rec(`cls|${t.dataset.medit}`);
    if (r) openAddForm({ ...r }, t.dataset.medit);
    return;
  }
  if (t.dataset.mdel) {
    const id = t.dataset.mdel;
    const r = Notes.rec(`cls|${id}`);
    if (!r) return;
    const hasNote = !!Notes.get(`M|${id}`);
    if (!confirm(`Usunąć zajęcia „${r.name}” (${r.date} ${r.start})?${hasNote ? "\nNotatka z tych zajęć trafi do przechowalni, nie zginie." : ""}`)) return;
    await Notes.put(`cls|${id}`, { ...r, deleted: true });
    state.expanded.delete(`M|${id}`);
    toast("Usunięto zajęcia");
    return render(true);
  }
  if ("nav" in t.dataset) return navSubject(t.dataset.nav, t.dataset.navType);
  if (t.dataset.goto) return navSubject(t.dataset.goto, t.dataset.gotoType);
  if (t.dataset.stoggle) {
    const k = t.dataset.stoggle;
    state.sOpen.has(k) ? state.sOpen.delete(k) : state.sOpen.add(k);
    return renderPrzedmioty();
  }
  const ok = t.dataset.move || t.dataset.copy || t.dataset.drop;
  const o = ok ? Notes.all[ok] : null;
  const keepMeta = (n) => ({ name: n.name, date: n.date, start: n.start, end: n.end, type_short: n.type_short });
  if (t.dataset.openNote) return openNote(t.dataset.openNote);
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(o.text); toast("Skopiowano tekst notatki"); } catch { prompt("Skopiuj notatkę:", o.text); }
    return;
  }
  if (t.dataset.drop) {
    if (!confirm(`Usunąć na stałe notatkę „${o.text.slice(0, 60)}”?`)) return;
    await Notes.save(ok, "", keepMeta(o));
    toast("Notatka usunięta");
    return render(true);
  }
  if (t.dataset.move) {
    const sel = document.querySelector(`[data-target-for="${CSS.escape(ok)}"]`);
    const b = prepared.blocks.find((x) => x.key === sel.value);
    const existing = Notes.get(b.nk)?.text;
    t.disabled = true; t.textContent = "Przenoszę…";
    await Notes.save(b.nk, existing ? `${existing}\n\n${o.text}` : o.text, keepMeta(b));
    await Notes.save(ok, "", keepMeta(o));
    toast(`Przeniesiono do: ${DAY_SHORT[b.s.getDay()]} ${fmtShort(b.s)}, ${b.start}`);
    return openClass(b.key);
  }
  if (t.dataset.toggle) {
    const k = t.dataset.toggle;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    state.noteMsg.delete(k);
    rerenderCard(k);
  } else if (t.dataset.open) {
    openClass(t.dataset.open);
  } else if (t.dataset.save) {
    const k = t.dataset.save;
    const blk = prepared.blocks.find((x) => x.nk === k);
    const meta = state.noteMeta.get(k) || (blk && metaOf(blk));
    if (!meta) return;
    const text = (state.drafts.has(k) ? state.drafts.get(k) : Notes.get(k)?.text || "").trim();
    t.disabled = true; t.textContent = "Zapisuję…";
    const res = await Notes.save(k, text, meta);
    state.drafts.delete(k);
    const time = hm(new Date());
    const msg = {
      local: { cls: "ok", text: `✓ Zapisano ${time}${Notes.repo() ? " (tylko na tym urządzeniu)" : ""}` },
      synced: { cls: "ok", text: `✓ Zapisano ${time} · widoczne na wszystkich urządzeniach` },
      offline: { cls: "dirty", text: `✓ Zapisano ${time} na tym urządzeniu · wyślę, gdy będzie internet` },
      auth: { cls: "dirty", text: `✓ Zapisano ${time} lokalnie · sprawdź synchronizację w Ustawieniach` },
    }[res];
    state.noteMsg.set(k, msg);
    toast(text ? "Notatka zapisana" : "Notatka usunięta");
    render(true);
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.dataset?.lim) { state.limDraft.set(ev.target.dataset.lim, ev.target.value); state.limMsg.delete(ev.target.dataset.lim); return; }
  const k = ev.target.dataset?.note;
  if (!k) return;
  state.drafts.set(k, ev.target.value);
  state.noteMsg.delete(k);
  const actions = ev.target.closest(".neditor")?.querySelector(".note-actions");
  if (actions) actions.innerHTML = `<button class="btn primary" data-save="${esc(k)}">Zapisz</button>${noteStatusHtml(k)}`;
});
document.addEventListener("focusout", (ev) => {
  // odłożone odświeżenie po wyjściu z pola (z opóźnieniem, żeby nie zgubić kliknięcia "Zapisz")
  if (ev.target.matches?.("textarea, select, input") && state.deferredRender) setTimeout(() => render(), 600);
});
document.addEventListener("keydown", (ev) => {
  const k = ev.target.dataset?.note;
  if (k && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); ev.target.closest(".neditor")?.querySelector("[data-save]")?.click(); }
});
window.addEventListener("beforeunload", (ev) => {
  for (const [k, v] of state.drafts) if (v !== (Notes.get(k)?.text || "")) { ev.preventDefault(); ev.returnValue = ""; return; }
});
function rerenderCard(k) {
  const el = document.querySelector(`.card[data-key="${CSS.escape(k)}"]`);
  const b = prepared.blocks.find((x) => x.key === k);
  if (!el || !b) return render(true);
  el.outerHTML = cardHtml(b, new Date(), changedMarks());
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}

async function getJSON(url) {
  const r = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}
let loading = false;
async function load(manual = false) {
  if (loading) return; loading = true;
  try {
    const [data, status] = await Promise.all([getJSON("data.json"), getJSON("status.json").catch(() => null)]);
    const changed = state.data && state.data.generated_at !== data.generated_at;
    state.data = data; state.status = status;
    render();
    if (manual) toast(changed ? "Pobrano nową wersję planu" : "Plan jest aktualny");
  } catch (e) {
    if (!state.data) $("#zjazdy").innerHTML = `<p class="empty">Nie udało się wczytać planu. Sprawdź połączenie i odśwież stronę.</p>`;
    else if (manual) toast("Brak połączenia — pokazuję ostatnią wersję");
  } finally { loading = false; }
  if (Notes.token) Notes.sync().then((changedNotes) => { if (changedNotes || state.tab === "ustawienia") render(); }).catch(() => state.tab === "ustawienia" && render());
}

load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("online", () => load());
window.addEventListener("offline", () => state.data && renderStatus());
setInterval(() => { if (!document.hidden) load(); }, 10 * 6e4);
setInterval(() => { if (state.data && !document.hidden) render(); }, 60 * 1000);
// notatki: sprawdzaj zmiany z innych urządzeń co 30 s, gdy strona jest na wierzchu
function syncNotesQuietly() {
  if (!Notes.token || document.hidden || !state.data) return;
  Notes.sync().then((changed) => { if (changed) render(); }).catch(() => {});
}
setInterval(syncNotesQuietly, 30 * 1000);
window.addEventListener("focus", syncNotesQuietly);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
